<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>NigguneiChabad</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-page="home" aria-label="NigguneiChabad home">
      <span class="brand-mark">נ</span>
      <span>Chabad Niggunim</span>
    </a>

    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="searchInput" type="search"
             placeholder="Search niggunim, singers, composers…"
             aria-label="Search music">
    </label>

    <div class="account-actions">
      <button class="button button-light" id="signInBtn">Sign in</button>
      <button class="button button-primary" id="createAccountBtn">Create account</button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <p class="sidebar-label">YOUR MUSIC</p>
      <button class="nav-item active" data-page="home">⌂ <span>Home</span></button>
      <button class="nav-item" data-page="search">⌕ <span>Search</span></button>
      <button class="nav-item" data-page="library">♡ <span>Your Library</span></button>
      <button class="nav-item" data-page="playlists">♫ <span>My Playlists</span></button>

      <div class="sidebar-divider"></div>
      <p class="sidebar-label">EXPLORE</p>
      <button class="nav-item" data-page="weekly">◷ <span>Niggunim of the Week</span></button>
      <button class="nav-item" data-page="top12">↗ <span>Top 12 of the Week</span></button>
      <button class="nav-item" data-page="composers">♬ <span>Composers</span></button>
      <button class="nav-item" data-page="singers">♩ <span>Singers</span></button>
      <button class="nav-item" data-page="categories">▦ <span>Categories</span></button>

      <div class="sidebar-bottom">
        <div class="mini-note">A home for Chabad niggunim.</div>
      </div>
    </aside>

    <main id="mainContent" tabindex="-1">
      <div class="loading-message">Loading your music…</div>
    </main>
  </div>

  <footer class="mobile-nav">
    <button data-page="home">⌂<span>Home</span></button>
    <button data-page="search">⌕<span>Search</span></button>
    <button data-page="library">♡<span>Library</span></button>
    <button data-page="playlists">♫<span>Playlists</span></button>
  </footer>

  <section id="playerBar" class="player-bar" hidden>
    <div class="now-playing">
      <div class="mini-cover" id="playerCover">♫</div>
      <div class="now-playing-text">
        <strong id="playerTitle">Choose a niggun</strong>
        <span id="playerArtist">Chabad Niggunim</span>
      </div>
      <button id="playerFavorite" class="icon-button" title="Add to favorites">♡</button>
    </div>

    <div class="player-controls">
      <div class="player-buttons">
        <button id="previousBtn" title="Previous song">⏮</button>
        <button id="playPauseBtn" class="play-button" title="Play or pause">▶</button>
        <button id="nextBtn" title="Next song">⏭</button>
      </div>
      <div class="progress-row">
        <span id="currentTime">0:00</span>
        <input id="progress" type="range" min="0" max="100" value="0"
               aria-label="Song progress">
        <span id="duration">0:00</span>
      </div>
      <audio id="audioElement" preload="metadata"></audio>
    </div>

    <button id="expandPlayerBtn" class="expand-player">Now playing ↗</button>
  </section>

  <div id="modalRoot"></div>
</body>
</html>
